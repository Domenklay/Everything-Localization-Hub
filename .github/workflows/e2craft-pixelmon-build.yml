name: Build E2Craft Pixelmon Vanilla Mobs
on:
  push:
    branches: ["build/e2craft-pixelmon-vanillamobs-v102"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build-tools/e2craft-pixelmon-vanilla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build with real NeoForge and verify Mixin annotations
        run: gradle clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: e2craft-pixelmon-vanilla-mobs-1.0.2
          path: build-tools/e2craft-pixelmon-vanilla/build/libs/*.jar