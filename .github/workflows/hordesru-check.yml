name: HordesRU release validation
on:
  push:
    paths:
      - 'Hordes-of-Azeroth/**'
      - '.github/workflows/hordesru-check.yml'
  pull_request:
    paths:
      - 'Hordes-of-Azeroth/**'
      - '.github/workflows/hordesru-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release ZIP and source agreement
        run: python3 Hordes-of-Azeroth/tests/validate_release.py
      - name: Install Lua 5.1 syntax checker
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          find Hordes-of-Azeroth/HordesRU Hordes-of-Azeroth/GlueXML -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
