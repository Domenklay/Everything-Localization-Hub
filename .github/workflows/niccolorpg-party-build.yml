name: Compile NiccoloRPG Party system (NeoForge 1.21.1)
on:
  push:
    branches: ["build/niccolorpg-party-shared-xp-v1"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build-tools/niccolorpg-party-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile actual NeoForge and verify party commands
        run: gradle clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: niccolorpg-party-classes-v1
          path: build-tools/niccolorpg-party-v1/build/libs/*.jar
